name: Unit Tests

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.5"

  # THE SINGLE K KNOB (#656, brief decision 1). Adding or removing a bucket is
  # changing this one number.
  #
  # It has to drive BOTH sides of the loop, and that is not a stylistic point.
  # The whale-split policy is derived and STORED by `ingest`, which compares
  # each package against total/K; `plan` only expands what the store already
  # says. So a K that reached `plan` alone would change how many buckets the
  # matrix has without changing which packages get split for them — the same
  # store would be re-planned into more, smaller lanes while a whale that now
  # exceeds the new total/K stayed whole and set the floor.
  #
  # Driving both from here makes the transition a single edit with a defined
  # settling time: bump K, and the next master `record-timings` run re-records
  # the split policy at the new K, after which `plan --k` realizes it.
  TESTBUCKET_K: "6"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    # Cap the handful of subprocess-backed codegen tests that call
    # testharness.CapStress at 5 inner runs instead of the global
    # -count=100. Unset means uncapped (local + nightly keep full
    # -count); only this job carries the knob. See
    # adapters/common/codegen/internal/testharness/stress.go.
    env:
      BAML_HEAVY_TEST_RUNS: "5"
    # The serial -race -count=100 sweep ran ~33-34 min on master, with
    # bamlutils/llmhttp alone ~15 min (~43%) pinning the job against its
    # ceiling — it timed out repeatedly even on runtime-inert PRs (#679).
    # The bamlutils dominator now runs in the parallel `bamlutils-race`
    # job below (the first, cheapest slice of the balanced-matrix shard
    # tracked in #656), cutting this job's serial loop to ~18-19 min. 50
    # min is now comfortable headroom over the remaining loop plus the
    # once-only sanity / codegen / fresh-tree gate steps, not a ceiling
    # being chased.
    timeout-minutes: 50

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.0

      - name: Set up Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "24.18.0"

      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@latest

      - name: Run Unit Tests (all modules)
        run: |
          # Adapter modules run their own tests inside cmd/build/build.sh
          # during the integration test workflow, against the BAML version
          # they're pinned to.
          #
          # adapters/common is also outside go.work (it directly requires
          # github.com/boundaryml/baml v0.204.0; keeping it in the workspace
          # would make go work sync lift its BAML pin to the workspace MVS
          # max — see go.work for the full rationale). With go.work active,
          # `go test ./...` from inside common resolves through the
          # workspace's main module (root), which doesn't contain
          # adapters/common packages, and fails setup. GOWORK=off forces
          # common's own go.mod to be the build list — same envelope
          # scripts/sync.sh uses for the per-adapter tidies.
          #
          # dynclient/baml-patched is skipped in this workspace-mode
          # loop: it's vendored upstream BAML source, isn't a go.work
          # member (see go.work), and would need GOWORK=off to test
          # from inside. Its standalone-mode coverage is provided by
          # the standalone-modules matrix job below, which runs
          # `GOWORK=off go test ./...` from inside it; the patched
          # module's behavior is additionally exercised transitively
          # through ./dynclient in this workspace-mode loop.
          #
          # internal/nativebody/nanollmprepare is skipped for the same
          # workspace-membership reason: it's a SEPARATE, test-only module
          # (de-BAML Phase 4b + 5.1) deliberately excluded from go.work so its
          # PUBLIC github.com/viktordanov/nanollm-ffi/go dependency — a cgo
          # module that embeds + links a prebuilt Rust archive — stays out of
          # the default module graph (see its go.mod). Running its `./...`
          # here would fail ("directory prefix . does not contain modules
          # listed in go.work"), and it is cgo/platform-bound, so it does not
          # belong in this pure-Go loop. Its SOLE execution is the gated
          # nanollm-prepare.yml (GOWORK=off, NO secret/credential and NO release
          # bundle — the public module is proxy/sumdb-resolvable and self-links
          # its embedded archive), which now runs unconditionally on every PR
          # incl. forks — nanollm must never block normal CI.
          #
          # nativeserve is skipped for the SAME reason (de-BAML #624): it is the
          # PUBLIC, out-of-go.work, nanollm-linked serve-core module the subprocess
          # worker AND an in-process dynclient consumer both import. Like
          # nanollmprepare it requires the cgo nanollm-ffi module and is excluded
          # from go.work, so `./...` here would fail the same way; its cgo gated
          # coverage runs in nanollm-send.yml (GOWORK=off).
          #
          # bamlutils is skipped here for a SCHEDULING reason, not a
          # workspace-membership one: its bamlutils/llmhttp package alone was
          # ~15 min of the ~33-34 min serial -race -count=100 sweep (~43%),
          # which pinned this job against its timeout even on runtime-inert
          # PRs (#679). It now runs in the dedicated `bamlutils-race` job
          # below — same workspace mode, same -race -count=100 -timeout 20m
          # flags, so coverage is byte-for-byte identical; only the lane
          # changed. This is the first slice of the balanced-matrix shard
          # tracked in #656.
          # Phase B (#656): each invocation now runs through
          # scripts/testbucket-capture.sh, which adds -json, tees the event
          # stream to $RUNNER_TEMP for the `record` job to ingest, and replays
          # the stream's output events so this log still reads exactly like a
          # plain `go test` log. Flags, module set and resolution modes are
          # unchanged, so coverage is identical to before; only the timing
          # capture is new. The events live under $RUNNER_TEMP, never in the
          # repo, because the fresh-tree gates below fail on a dirty tree.
          repo_root=$PWD
          events_dir="$RUNNER_TEMP/testbucket-events"
          mkdir -p "$events_dir"
          find . -name go.mod -not -path '*/adapters/adapter_*' -not -path '*/dynclient/baml-patched/*' -not -path '*/internal/nativebody/nanollmprepare/*' -not -path '*/nativeserve/*' -not -path './bamlutils/*' -exec dirname {} \; | while read -r dir; do
            echo "=== Testing $dir ==="
            slug=$(printf '%s' "$dir" | sed 's|^\./||; s|^\.$|root|; s|/|-|g')
            events="$events_dir/unit-tests-$slug.ndjson"
            if [ "$dir" = "./adapters/common" ]; then
              (cd "$dir" && GOWORK=off "$repo_root/scripts/testbucket-capture.sh" "$events" -race -count=100 -timeout 20m ./...)
            else
              (cd "$dir" && "$repo_root/scripts/testbucket-capture.sh" "$events" -race -count=100 -timeout 20m ./...)
            fi
          done

      - name: Upload timing events
        # if: always() so a RED run still contributes what it measured. ingest
        # drops a failed package's weight (its wall time measures the failure,
        # not the work) but keeps every package that passed, so one flaky lane
        # cannot stall the store.
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: testbucket-events-unit-tests
          path: ${{ runner.temp }}/testbucket-events/
          if-no-files-found: warn
          retention-days: 7

      - name: Subprocess build + test sanity
        # The default loop above runs everything under the no-tag build
        # (which is now the direct in-process worker path). The
        # `subprocess` tag flips a few key call sites and removes the
        # recover wrappers in pool + worker; this step
        # exercises that the tag still compiles cleanly and the
        # subprocess-only tests pass. Kept narrow on purpose — running
        # -race -count=100 across every module under subprocess would
        # roughly double CI wallclock for marginal additional coverage.
        run: |
          go build ./...
          # Route the subprocess-tag sanity build artifact to $RUNNER_TEMP so
          # it doesn't leave an untracked `serve` binary in the repo root
          # that would trip the `cmd/regenerate-dynclient fresh-tree gate`
          # below.
          go build -tags=subprocess -o "$RUNNER_TEMP/serve-build-sanity" ./cmd/serve
          go test -tags=subprocess -count=1 ./pool ./worker ./cmd/serve
          go test -race -tags=subprocess -count=1 ./pool ./worker

      - name: de-BAML S2 artifact profile proofs
        # Two tag-gated proofs for the serving-cutover S2 artifact contract that
        # the default loop above cannot run:
        #
        #  - `nativeworkerartifact` is the build tag cmd/build/build.sh sets when
        #    it embeds an isolated-module (natively linked) worker. The tagged
        #    half of the tag-split host constant only compiles under it, so
        #    without this step the "this build is the native-capable artifact"
        #    assertion would be dead code and the tag could silently invert.
        #
        #  - `artifactrehearsal` is the LIVE rollback rehearsal: it builds the
        #    BAML-only rollback worker, boots it through the real go-plugin
        #    handshake, serves RPCs on it, and requires that a MISLABELLED profile
        #    stamp — and a well-formed but WRONG release artifact ID — refuse to
        #    serve. It is tag-gated because the default loop runs every test with
        #    -race -count=100, and rebuilding and rebooting a worker binary a
        #    hundred times would dominate that lane.
        #
        # The NATIVE-capable artifacts are proved separately, in nanollm-prepare.yml
        # (`-tags=nativeartifactproof`), because only that lane can build them: they
        # need CGO and a linked nanollm archive, which this lane deliberately keeps
        # out. That proof fails rather than skips when the artifacts are missing.
        #
        # Both write their build output outside the repo (RUNNER_TEMP / the
        # test's own temp dir) so the fresh-tree gates below stay clean.
        run: |
          go vet -tags=nativeworkerartifact ./cmd/serve
          go build -tags=subprocess,nativeworkerartifact -o "$RUNNER_TEMP/serve-native-artifact-sanity" ./cmd/serve
          go test -tags=subprocess,nativeworkerartifact -count=1 ./cmd/serve
          go vet -tags=artifactrehearsal ./internal/workerboot
          go test -tags=artifactrehearsal -count=1 -timeout 10m ./internal/workerboot

      - name: Verify framework adapter codegen-emit
        # Two independent checks per adapter: deterministic emission
        # (run the emitter twice, byte-compare) and behavioural test
        # parity (copy the per-adapter module to a tempdir, write the
        # emitted adapter.go into it, run GOWORK=off go test ./adapter/).
        # The verifier writes only to tempdirs; the source-tree
        # adapters/adapter_v*/adapter/ siblings (test harnesses,
        # dynamic_value.go) are never touched.
        run: go run ./cmd/verify-framework-adapter

      - name: scripts/sync.sh fresh-tree gate
        # Fresh-tree gate for the sync.sh / per-adapter BAML-pin contract.
        # Running sync.sh on a clean checkout must leave every pinned
        # module's go.mod / go.sum byte-identical: if `go work sync` ever
        # lifts a pin (the regression fixed by removing adapters/common
        # from go.work), this step fails with a diff. The verify step
        # double-asserts the pin matrix via cmd/verify-adapter-pins so a
        # diff-free-but-wrong state can't slip through either.
        #
        # The diff covers ALL Go module metadata, not just adapter paths
        # (#473). scripts/sync.sh is a bounded fixed-point loop, so a
        # converged tree re-run must be byte-clean across every go.mod /
        # go.sum / go.work / go.work.sum. Diffing the whole set here means
        # a future non-convergence surfaces as a direct "scripts/sync.sh
        # is not idempotent" failure at this step, instead of leaking into
        # the confusing "tree dirty before cmd/regenerate-dynclient" error
        # downstream — which is exactly how #473 manifested.
        #
        # go.work.sum is excluded from --exit-code and restored instead:
        # it's an additive checksum database (not a lockfile), and an
        # earlier workspace-mode Go command in this job may have appended
        # module-content sums the committed file lacks. That additive
        # growth is tolerated repo-wide (see the cmd/regenerate-dynclient
        # gate below and #442); restoring it to HEAD keeps that tolerance
        # while the full set below still fails on any go.mod/go.sum drift.
        run: |
          git status --porcelain
          ./scripts/sync.sh
          git checkout -- go.work.sum 2>/dev/null || true
          git diff --exit-code -- \
            go.mod go.sum go.work \
            '*/go.mod' '*/go.sum'

      - name: cmd/regenerate-dynclient fresh-tree gate
        # Fresh-tree gate for committed dynclient regeneration artifacts.
        # The regen tool owns dynclient/internal/generated/**,
        # dynclient/baml-patched/**, root embed.go, and related provenance.
        # Running it on a clean checkout must leave the tree byte-identical.
        # Pairs with PR #299 normalization — without this gate, regen drift
        # accumulates silently across PRs (the latent-drift class of bug
        # that produced #299).
        run: |
          # go.work.sum may be dirtied by earlier workspace-mode Go commands
          # (the per-module test loop above appends additive module-content
          # checksums). Restore the committed version before checking
          # dynclient-owned drift. This only discards uncommitted go.work.sum
          # mutations — `git checkout -- go.work.sum` restores it to HEAD,
          # which already includes any committed PR change, and the full-tree
          # status check immediately below still fails on every other dirty
          # file (#442).
          git checkout -- go.work.sum 2>/dev/null || true

          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR: tree is dirty before cmd/regenerate-dynclient."
            git status --short
            git diff
            exit 1
          fi

          go run ./cmd/regenerate-dynclient

          # go.work.sum is an additive checksum database, not a lockfile.
          # The regen's transitive `go mod tidy` may append entries that
          # weren't present at commit time if the Go module proxy has
          # published new sums since. Restore the committed version so
          # additive-only sum drift doesn't trip the idempotency gate.
          git checkout -- go.work.sum 2>/dev/null || true

          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR: cmd/regenerate-dynclient is not idempotent on this commit."
            git status --short
            echo
            echo "Tracked diff:"
            git diff
            echo
            echo "Untracked files:"
            git ls-files --others --exclude-standard
            exit 1
          fi

  # Dedicated parallel lane for the bamlutils module — specifically its
  # bamlutils/llmhttp package, the single heaviest unit in the
  # -race -count=100 sweep (~15 min, ~43% of the old serial budget). Pulling
  # it out of the unit-tests serial loop above is the cheapest real slice of
  # the balanced-matrix shard tracked in #656 and the direct remediation for
  # the chronic 50-min timeout (#679). This lane runs bamlutils in the SAME
  # workspace mode with the SAME flags the serial loop used for it, so
  # coverage is byte-for-byte identical — only the scheduling changed. The
  # GOWORK=off -count=1 standalone sanity for bamlutils still runs in the
  # standalone-modules matrix below. No Node/goimports setup: nothing under
  # bamlutils shells out to them (unlike the codegen/adapter paths that keep
  # them in the main job).
  bamlutils-race:
    runs-on: ubuntu-latest
    # Mirror the unit-tests job's CapStress knob for envelope parity. No
    # bamlutils test consults BAML_HEAVY_TEST_RUNS today, but keeping the two
    # lanes identical avoids a surprise if a heavy codegen-style test ever
    # lands under bamlutils.
    env:
      BAML_HEAVY_TEST_RUNS: "5"
    # ~15 min actual. 25 leaves margin above the 20 min per-invocation
    # -timeout so the Go test timeout fires first with a useful goroutine
    # dump instead of the job being hard-killed.
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.0
        with:
          # This lane only fetches the tree and runs `go test`; it never
          # pushes and needs no persisted git token, so drop it from
          # .git/config (defense-in-depth for a job that executes PR code).
          # Matches the hardening nanollm-*/bamlfuzz/unicode-parity already
          # apply; the pre-existing checkouts in this file are left as-is
          # (out of scope for this timeout fix — see PR thread).
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run bamlutils Unit Tests (-race -count=100)
        run: |
          # Workspace mode (go.work active), matching exactly how the
          # unit-tests serial loop invoked bamlutils before the split.
          #
          # Phase B (#656): wrapped in scripts/testbucket-capture.sh for timing
          # capture. Same flags, same mode, same packages — the capture only
          # adds -json and tees the stream, then replays it so this log is
          # unchanged. This lane matters most to the store: bamlutils/llmhttp
          # is the whale the whole bucketing exercise exists to harpoon.
          events_dir="$RUNNER_TEMP/testbucket-events"
          mkdir -p "$events_dir"
          repo_root=$PWD
          cd bamlutils
          "$repo_root/scripts/testbucket-capture.sh" \
            "$events_dir/bamlutils-race.ndjson" \
            -race -count=100 -timeout 20m ./...

      - name: Upload timing events
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: testbucket-events-bamlutils
          path: ${{ runner.temp }}/testbucket-events/
          if-no-files-found: warn
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Phase B (#656): the WRITE side of the self-optimizing timing store.
  #
  # MASTER ONLY, per owner decision 3. The store is a rolling CI cache, not a
  # committed file and not a bot commit: a PR restores the last-known-good
  # store and never writes one, so no PR can poison the split every other PR
  # is planned from, and a fork PR needs no write permission at all.
  #
  # Rot mitigations, all three from decision 3, live here or in the tool:
  #   * cache-key + restore-keys fallback — the key is per-commit so every
  #     master run writes a fresh immutable entry, and the prefix restore-key
  #     hands the newest previous entry to whoever asks. A total miss is not
  #     an error: `plan` cold-starts on the mean weight.
  #   * cold-start on a miss — proved on every run by the `timings-restore`
  #     job below, which also runs on PRs.
  #   * loaded-vs-missing summary — printed at the end of this job, so a store
  #     that quietly stopped growing is visible in the log rather than three
  #     weeks later as a mysteriously bad split.
  record-timings:
    needs: [unit-tests, bamlutils-race]
    # !cancelled() rather than always(): record what a red run measured (the
    # passing packages still have honest timings, and ingest drops the failed
    # ones), but do not try to record a cancelled one, whose artifacts are
    # arbitrary partial captures.
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.0
        with:
          # Reads events and writes a cache entry; it never pushes.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download timing events
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: testbucket-events-*
          merge-multiple: true
          path: ${{ runner.temp }}/testbucket-events

      - name: Restore the previous timing store
        uses: actions/cache/restore@v4.2.4
        with:
          path: ${{ runner.temp }}/testbucket-store
          # Per-commit key. GitHub cache entries are IMMUTABLE, so this is a
          # deliberate choice rather than an incidental one: each NEW master
          # commit writes exactly one entry, and a re-run of the same commit
          # restores that entry and cannot replace it (the save below logs a
          # duplicate-key warning and moves on). That is the property the
          # design wants — the split a PR sees is deterministic for a given
          # master SHA rather than drifting with however many times that SHA
          # was re-run. If a re-run should instead contribute a fresh EWMA
          # sample, add ${{ github.run_id }} to the key; the cost is losing
          # that determinism.
          #
          # The prefix restore-key hands this run the newest PREVIOUS entry,
          # which is what rolls the weights forward through EWMA instead of
          # restarting from scratch.
          key: testbucket-timings-v1-${{ github.sha }}
          restore-keys: |
            testbucket-timings-v1-

      - name: Ingest timings into the store
        run: |
          set -euo pipefail
          store_dir="$RUNNER_TEMP/testbucket-store"
          events_dir="$RUNNER_TEMP/testbucket-events"
          mkdir -p "$store_dir"

          shopt -s nullglob
          events=("$events_dir"/*.ndjson)
          if [ ${#events[@]} -eq 0 ]; then
            echo "no timing events were uploaded; nothing to record" >&2
            exit 1
          fi
          echo "ingesting ${#events[@]} event file(s)"

          # --race --count=100 is the flag set BOTH instrumented lanes run
          # under. It is stored with the weights: if the sweep depth ever
          # changes, `plan` sees the mismatch and cold-starts loudly instead
          # of balancing on numbers that no longer mean anything.
          # --whale-k is the SAME K the plan below uses; see TESTBUCKET_K.
          go run ./cmd/testbucket ingest \
            --store "$store_dir/test-timings.json" \
            --race --count=100 \
            --whale-k "$TESTBUCKET_K" \
            "${events[@]}"

      - name: Show the plan the next PR will get
        run: |
          set -euo pipefail
          # Not a gate, a window: this prints the loaded-vs-missing summary and
          # the split the freshly recorded store produces, so a store that
          # stopped growing — or a whale that just crossed the split threshold
          # — is visible on the master run that caused it.
          #
          # Same K as the ingest above. If these two ever disagree the store's
          # split policy is derived for a different bucket count than the one
          # the matrix fans out to, which is the failure the single knob
          # exists to prevent.
          echo "planning at the recorded K=$TESTBUCKET_K"
          go run ./cmd/testbucket plan \
            --k "$TESTBUCKET_K" \
            --store "$RUNNER_TEMP/testbucket-store/test-timings.json"

      - name: Save the timing store
        # Writes on a new master commit; on a same-SHA re-run the entry
        # already exists and the action warns instead of overwriting. See the
        # restore step for why per-commit immutability is wanted here.
        uses: actions/cache/save@v4.2.4
        with:
          path: ${{ runner.temp }}/testbucket-store
          key: testbucket-timings-v1-${{ github.sha }}

      - name: Upload the timing store
        # The cache is the mechanism; the artifact is the receipt. It makes
        # the store downloadable for inspection without re-running anything,
        # which is how the Phase C measurements get their baseline.
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: testbucket-timing-store
          path: ${{ runner.temp }}/testbucket-store/test-timings.json
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Phase B (#656): the READ side, and the standing proof of decision 3's two
  # rot mitigations. Runs on PRs as well as master, and is deliberately cheap.
  #
  # It answers the two questions that decide whether the bucketing mechanism is
  # usable at all, on every run rather than once at review time:
  #   1. does a PR restore the store master recorded, and
  #   2. does a TOTAL cache miss still produce a valid, complete matrix?
  #
  # Both must hold. If (1) breaks the split silently degrades to cold-start
  # quality; if (2) breaks, a cache expiry takes the whole matrix down.
  timings-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Capture-script regression tests
        # The capture wraps every `go test` invocation in the two heavy lanes,
        # so a bug in it is a bug in the unit-test job itself. The sharpest
        # one it guards is fail-open: a pipeline's status is its LAST
        # command's, so without an explicit PIPESTATUS read a RED suite would
        # be reported through the renderer's happy exit and the job would go
        # green. These tests pin that first.
        run: bash scripts/testbucket-capture_test.sh

      - name: Restore the last-known-good timing store
        id: restore
        uses: actions/cache/restore@v4.2.4
        with:
          path: ${{ runner.temp }}/testbucket-store
          key: testbucket-timings-v1-${{ github.sha }}
          restore-keys: |
            testbucket-timings-v1-

      - name: Plan from the restored store
        run: |
          set -euo pipefail
          store="$RUNNER_TEMP/testbucket-store/test-timings.json"
          if [ -f "$store" ]; then
            echo "restored a store from cache key '${{ steps.restore.outputs.cache-matched-key }}'"
          else
            echo "no store in the cache yet — this run exercises the cold-start path"
          fi
          # Either way this must exit 0 with a complete matrix. The coverage
          # gate inside `plan` is what makes that meaningful: it fails loudly
          # if any live package is left unscheduled, so a green line here is
          # a real statement about coverage and not just about exit codes.
          go run ./cmd/testbucket plan --k "$TESTBUCKET_K" --store "$store"

      - name: Cold start from a guaranteed miss
        run: |
          set -euo pipefail
          # The mitigation that has to work when the cache expires. A store
          # that is not there must produce a valid, coverage-complete matrix
          # on mean weights, not a failed job.
          go run ./cmd/testbucket plan \
            --k "$TESTBUCKET_K" \
            --store "$RUNNER_TEMP/definitely-not-a-store.json"

  # Per-module GOWORK=off sanity matrix for the modules we publish
  # release tags for. The job above runs everything under the
  # workspace, which masks per-module go.sum drift: a missing
  # `pkg@ver/go.mod` hash in worker/go.sum is silently covered by
  # go.work.sum during the workspace build, so the failure only
  # surfaces during release-prep (or for external consumers who
  # always resolve via GOWORK=off semantics, since they don't share
  # our go.work). #327 was the most recent miss of this shape: a
  # stale dynclient/go.sum that only got caught by a maintainer's
  # manual check during the 0.0.47 release-prep.
  #
  # Matrix mirrors release-lib.sh's `release_required_modules`. Keep
  # the two in sync if a future release adds or removes a published
  # module. adapters/adapter_v* and the root module are excluded for
  # the same reasons release-lib.sh excludes them (per-adapter BAML
  # pins, workspace-only respectively).
  standalone-modules:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        module:
          - adapters/common
          - bamlutils
          - dynclient
          - dynclient/baml-patched
          - introspected
          - worker
          - workerplugin

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.0

      - name: Set up Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: GOWORK=off go test ./...
        run: |
          cd "${{ matrix.module }}"
          GOWORK=off go test ./... -count=1
