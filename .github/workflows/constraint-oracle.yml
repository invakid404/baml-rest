name: Constraint Evaluator Oracle

# Runs the de-BAML STOCK-BAML-v0.223.0 CFFI differentials that live behind
# //go:build integration under internal/: the constraint evaluator oracle
# (internal/debaml/constraintoracle), the guard-removal ledger harness
# (internal/debaml/guardledger), the bamlprofile oracle
# (internal/bamlprofile/profileoracle), the serving-shaped oracle (in package
# internal/debaml), the Checked[T] wire/assert-error byte authority
# (internal/debaml/checkedwire) and the six-operator predicate authority
# (internal/debaml/predicatewire).
#
# Why its own workflow. Every one of those packages is integration-tagged and
# under internal/, so neither of the existing lanes reaches it:
# `go build -tags integration ./...` skips _test.go files and testdata
# directories, and the integration matrix runs `go test -tags=integration
# ./integration/...` only. Without this job the fail-closed claim the evaluator
# makes — never a boolean stock did not produce — would be unenforced on PRs,
# which is exactly the gap this file closes.
#
# It is cheap: no Docker, no mock LLM, no container build. Each lane links the
# stock BAML CFFI (auto-downloaded on first use and cached here) and drives
# Parse.<Method> / CallFunctionParse over fixed assistant text — no network
# calls to a provider, and no secrets.

on:
  pull_request:
    paths:
      - "internal/debaml/**"
      # The profile oracle's CFFI differentials and their recorded fixtures live
      # under profileoracle/; the constraint façade they measure lives one level
      # up in the same tree, so the whole package is a trigger.
      - "internal/bamlprofile/**"
      # bamlutils is a trigger because the checked-wire lane is the SOURCE OF
      # TRUTH for bamlutils.Checked: it is the only place the carrier's bytes are
      # compared against the live stock v0.223.0 CFFI. Without this path a change
      # to bamlutils/checked.go alone would skip the byte oracle entirely and the
      # carrier's stock-parity claim would rest on its unit literals, which are
      # copies of what that lane measures rather than an independent check.
      - "bamlutils/**"
      - ".github/workflows/constraint-oracle.yml"
      - "go.mod"
      - "go.sum"
  push:
    branches: [master]
    paths:
      - "internal/debaml/**"
      - "internal/bamlprofile/**"
      - "bamlutils/**"
      - ".github/workflows/constraint-oracle.yml"
      - "go.mod"
      - "go.sum"
  workflow_dispatch:

concurrency:
  group: constraint-oracle-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.5"

jobs:
  constraint-oracle:
    # linux/amd64 ON PURPOSE. Part of what this job proves is architecture
    # dependent: Go's out-of-range int64(float64) conversion SATURATES on arm64
    # and does not on amd64, so the round-3 `op_i64max` divergence and the
    # round-10 integral-float `2.0 ** 63` promotion are only observable here.
    # A macOS/arm64 developer run is a weaker check, not an equivalent one.
    runs-on: ubuntu-latest
    # The SIX integration steps below each carry their own 15-minute `go test`
    # timeout, and a Go timeout is worth more than a job cancellation here: it
    # dumps every goroutine, which is the only diagnosis available for the CFFI
    # HANG cases this lane deliberately isolates (`is divisibleby(0)` takes the
    # stock process down rather than returning). An Actions cancellation throws
    # that dump away.
    #
    # THE BUDGET MUST EXCEED THE SUM OF THE INNER GO TIMEOUTS, so the inner
    # timeout always fires first and the dump always survives. 6 x 15m = 90m of
    # inner budget, plus ~15m of headroom for checkout/setup/vet/the unit step
    # and for the dump itself to be written and uploaded. At exactly 75 a hung
    # earlier lane would starve a later one of its own diagnostic timeout —
    # which is how this number went from 45 to 60 when the profileoracle lane was
    # added, from 60 to 75 when the serving-oracle lane was, from 75 to 90 when the
    # checked-wire lane was, and from 90 to 105 when the predicate-wire lane was.
    # Any future step with its own `-timeout` must raise this too.
    timeout-minutes: 105
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.0

      - name: Set up Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache the stock BAML CFFI library
        # The generated client downloads libbaml_cffi on first use and keeps it
        # under the user cache dir. Caching it keeps the job at well under a
        # minute after the first run; a miss just re-downloads.
        uses: actions/cache@v4.2.4
        with:
          path: ~/.cache/baml
          key: baml-cffi-0.223.0-${{ runner.os }}

      - name: Compile the integration-tagged tree
        # Cheap guard that the oracles' own sources still build under the tag,
        # independent of whether the runs below get that far.
        run: go vet -tags integration ./internal/debaml/... ./internal/bamlprofile/...

      - name: Constraint evaluator differential vs stock BAML v0.223.0
        # The load-bearing assertion is TestConstraintProfileIsFailClosed: for
        # every corpus case, native must reproduce stock exactly or refuse with
        # ErrConstraintUnsupported. TestGeneratedClientIsFresh proves the client
        # being driven was generated from the checked-in .baml, and
        # TestConstraintFixtureDrift proves that .baml still matches the corpus.
        env:
          CGO_ENABLED: "1"
        run: go test -tags integration -count=1 -v -timeout 15m ./internal/debaml/constraintoracle/

      - name: Guard-removal ledger proof harness vs stock BAML v0.223.0
        # Slice 7.2a-1's witness rows: every guard in the constraint evaluator's
        # compensation layer, driven through the same stock CFFI. The stock
        # outcome envelope is RECORDED first and the native leg compared against
        # that recording, so a guard can never be removed on fork-only evidence.
        # TestGuardLedgerIsFailClosed is the load-bearing assertion here, and
        # TestGuardLedgerCoversEveryLedgerRecord ties the in-repo ledger
        # (internal/debaml/guard_ledger.md) to the rows that justify it.
        #
        # It carries two SUBPROCESS rows — `is divisibleby(0)`, which takes the
        # CFFI process down, and an oversized `range` — so the timeout allows for
        # a child that has to be killed at its 45s deadline.
        env:
          CGO_ENABLED: "1"
        run: go test -tags integration -count=1 -v -timeout 15m ./internal/debaml/guardledger/

      - name: bamlprofile oracle vs stock BAML v0.223.0
        # The third CFFI differential, and the one that makes the de-BAML
        # TARGET-LEVEL constraint gate an enforced claim rather than an opt-in
        # one. TestStockTargetLevelConstraintDispositionAndNativeDecline builds
        # each constrained return type as real BAML source, parses it through the
        # untouched v0.223 runtime (CallFunctionParse -> run_user_checks ->
        # validate_asserts), and asserts internal/debaml DECLINES the equivalent
        # bundle beside it — so "native no longer serves where stock raises" is
        # measured on every PR instead of asserted in a report. Without this step
        # the test is integration-tagged under internal/ and no lane reaches it:
        # unit-tests runs untagged, the integration matrix runs ./integration/...
        # only, and the two steps above name their packages explicitly.
        #
        # The whole package runs, not just that test: the prompt/fault/constraint
        # differentials beside it are the same shape of stock-CFFI claim and were
        # equally unenforced.
        env:
          CGO_ENABLED: "1"
        run: go test -tags=integration -count=1 -v -timeout 15m ./internal/bamlprofile/profileoracle/

      - name: Serving-shaped differential oracle vs stock BAML v0.223.0
        # Slice 7.2a-3. Builds an IN-MEMORY .baml project from each corpus row's
        # schema.Bundle, drives it through the stock CFFI's CallFunctionParse —
        # the same entry point the generated Parse.<Method> wrappers call — and
        # compares the recorded stock envelope against the native coercion-state
        # collector + evaluator. TestServingOracleFailClosed is the load-bearing
        # assertion (native reproduces stock or refuses; never a boolean stock did
        # not produce) and TestServingOracleBoundaryLock is the invariant that
        # every constraint-bearing bundle still DECLINES through checkSupported,
        # SupportsNativeFinalBundle and ParseStaticBundle, target-level included.
        #
        # It also RE-DRIVES the 719-case constraint corpus serving-shaped
        # (TestServingOracleBridgeCorpus), through the checked-in artifact
        # constraintoracle's TestConstraintCorpusBridgeExport re-renders and
        # byte-compares in the step above — so the two lanes are ordered: a corpus
        # change fails the export step first, and the consumer picks it up here.
        #
        # It carries one SUBPROCESS row — `is divisibleby(0)` again, isolated so a
        # CFFI abort cannot take the corpus down — whose child is killed at a 45s
        # deadline, so the step budget allows for that.
        env:
          CGO_ENABLED: "1"
        run: go test -tags=integration -count=1 -v -timeout 15m -run 'TestServingOracle' ./internal/debaml/

      - name: Checked[T] wire + assert-error byte authority vs stock BAML v0.223.0
        # Slice 7.2b-1. The BYTE ORACLE the serving slice stands on: an in-memory
        # .baml project driven through the same CallFunctionParse entry point, whose
        # captures are pinned as raw literals — the wire form of a checked value under
        # sonic (the serializer worker/parse.go uses), and the UNMODIFIED err.Error()
        # of a failed @assert, escaping and wrapper chain included. The #665 collapsed
        # `reason` strings are explicitly NOT the acceptance assertion here.
        #
        # It also proves bamlutils.Checked reproduces stock's bytes exactly, and
        # re-asserts the three recorded asymmetries (bare-string skip, duplicate
        # labels, alias ingress) as declines at the exported entry points. Nothing in
        # it is reachable from a production build.
        env:
          CGO_ENABLED: "1"
        run: go test -tags=integration -count=1 -v -timeout 15m ./internal/debaml/checkedwire/

      - name: Six-operator predicate authority vs stock BAML v0.223.0
        # Slice 7.2c-1. The byte + error authority for the six DIRECT COMPARISONS on the
        # two name-pinned static families, captured before any of them is admitted. Unlike
        # the checked-wire lane above it builds ISOLATED projects — one runtime each —
        # because a single .baml cannot declare six predicate variants of one class name,
        # and renaming the class would capture a different family.
        #
        # Three load-bearing assertions: TestStockOperatorWireBytes /
        # TestStockOperatorAssertBytes and their TestStockTopLevelOperator* twins pin raw
        # sonic bytes and whole unmodified err.Error() strings for all 48 rows — 24 nested
        # and 24 top-level, which the scope requires separately because a top-level assert
        # failure carries no required-field wrapper; TestDirectIntBoundaryMatrix drives
        # the ±2^53 and i64-endpoint matrix through stock and independently re-evaluates
        # every row with the production evaluator, failing on any boolean stock did not
        # produce; and TestPredicateWireAdmissionIsUnchanged re-asserts that FIVE of the
        # six are still refused by the production gates — the no-flip invariant, stated
        # where the captures are and proven to bite by
        # TestPredicateWireAdmissionIsProvenToBite.
        env:
          CGO_ENABLED: "1"
        run: go test -tags=integration -count=1 -v -timeout 15m ./internal/debaml/predicatewire/

      - name: Constraint evaluator unit lane
        # The CGO-free half of the same claim, so a guard cannot be removed
        # without a red lane even if the oracle job is skipped by paths.
        #
        # ServingOracle is in the list because the serving oracle's BOUNDARY half
        # is deliberately untagged (serving_oracle_gate_test.go): it drives
        # checkSupported / checkSupportedFields / checkSupportedType by name and
        # proves the oracle is unreachable from production, neither of which needs
        # CGO or the CFFI.
        run: go test -count=1 -run 'Constraint|JinjaHelpers|Evaluator|Withdrawn|GuardLedger|RemovedGuard|RemovedLength|RemovedLast|ServingOracle' ./internal/debaml/
