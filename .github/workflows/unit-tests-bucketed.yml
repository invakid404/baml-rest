name: Unit Tests (bucketed)

# Phase C of the test-bucketing graph (#656): plan -> test (generated matrix)
# -> record, running SIDE BY SIDE with unit-tests.yml rather than replacing it.
#
# Both workflows fire on the same triggers so the two makespans can be compared
# on the same commits. Nothing here modifies the existing lanes; Phase D
# promotes this one and deletes them once the soak gate passes.
#
# The mechanism in one paragraph: a cheap `plan` job restores the rolling
# timing store, partitions the live package set K ways with Karmarkar-Karp, and
# emits a `fromJSON` matrix. The `test` job fans out over it, each bucket
# running only its own slice. A master-only `record` job folds the measured
# timings back in, so the next run's split is better than this one's. The
# never-drop-a-test coverage gate inside `plan` is what makes the fan-out safe:
# it refuses to emit a matrix unless every live package lands in exactly one
# bucket, so a green matrix is a statement about coverage and not just about
# exit codes.

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: unit-tests-bucketed-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.5"

  # THE SINGLE K KNOB, shared with unit-tests.yml's record job (#656 decision
  # 1). It drives BOTH `ingest --whale-k` and `plan --k`, because the
  # whale-split policy is derived and stored at record time against total/K
  # while the matrix width is applied at plan time — a K that reached only one
  # of them would fan out to more buckets without splitting the whales those
  # buckets need split. Changing lane count is changing this number, and it
  # settles on the next master record run.
  TESTBUCKET_K: "6"

  # Where the plan-emitted invocations tee their `go test -json` streams.
  #
  # A fixed absolute path rather than $RUNNER_TEMP on purpose: the path is
  # baked into the script by the PLAN job and executed by the TEST job, and
  # those are different runners. A literal path is valid in both; an expansion
  # of a per-job variable would not be.
  TESTBUCKET_EVENTS_DIR: /tmp/testbucket-events

jobs:
  # ---------------------------------------------------------------------------
  # 1/3 — PLAN. Cheap, and the gate for everything downstream.
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Restore the timing store
        id: restore
        uses: actions/cache/restore@v4.2.4
        with:
          path: ${{ runner.temp }}/testbucket-store
          # Prefer this workflow's own store, then fall back to the one
          # unit-tests.yml's record job seeds. The fallback matters on day one
          # and after a cache expiry: the bucketed lane inherits the existing
          # measurements instead of cold-starting into an unbalanced matrix,
          # and then evolves its own — measured under -p=1, so contention-free
          # and comparable across runs.
          key: testbucket-timings-bucketed-v1-${{ github.sha }}
          restore-keys: |
            testbucket-timings-bucketed-v1-
            testbucket-timings-v1-

      - name: Compute the bucket matrix
        # Cut over to the standalone tool's composite action (testbucket v0.1.1),
        # pinned to the exact tag. The action installs the released binary and
        # runs the planner, so the never-drop coverage-completeness gate still
        # runs INSIDE it (a live target left unscheduled exits non-zero and emits
        # no matrix — the fan-out fails closed rather than open). --json /
        # --shard-plan are emitted by the action; the summary still lands on this
        # job's log.
        #
        #   version: v0.1.1   pin the installed binary too (there is no `v1`
        #                     release, so the action's default alias would fail).
        #   count: "100"      F1 — the action input defaults to "1"; leaving it
        #                     would collapse the flake sweep AND cold-start the
        #                     timing store via a `-race -count=1` token mismatch.
        #   node-prefixes     reproduces the former in-repo default; flags the
        #                     bucket holding adapters/** so `matrix.needs_node`
        #                     gates the setup-node + goimports steps below.
        #   exclude-module    the module set this pure-Go lane sweeps: the
        #                     pinned-BAML adapters (the integration workflow owns
        #                     them), vendored upstream baml-patched, and the two
        #                     cgo modules kept out of go.work. Scopes BOTH the
        #                     split and the never-drop coverage gate.
        id: plan
        uses: invakid404/testbucket/.github/actions/plan@551d49cea6a74a99706912fe18504f318bdba1cc # v0.1.1
        with:
          version: v0.1.1
          k: ${{ env.TESTBUCKET_K }}
          count: "100"
          store-path: ${{ runner.temp }}/testbucket-store/test-timings.json
          events-dir: ${{ env.TESTBUCKET_EVENTS_DIR }}
          shard-plan: ${{ runner.temp }}/shard-plan.json
          node-prefixes: adapters
          exclude-module: |
            adapters/adapter_*
            dynclient/baml-patched
            internal/nativebody/nanollmprepare
            nativeserve

      - name: Upload the shard plan
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: testbucket-shard-plan
          path: ${{ runner.temp }}/shard-plan.json
          if-no-files-found: warn
          retention-days: 14

      - name: Cold-start plan gate (guaranteed cache miss)
        # M3 — migrated from unit-tests.yml's `Cold start from a guaranteed
        # miss`. The plan action above restored a live store (or the legacy
        # fallback) and planned from it; this proves the OTHER path — a total
        # cache miss — still yields a valid, coverage-complete matrix on the
        # cold-start mean weight, so a cache expiry can never take the whole
        # fan-out down. It plans against a path GUARANTEED not to exist (never
        # the restored store path), which the tool treats as a cold start rather
        # than an error.
        #
        # The binary is already on PATH: the plan action's install-testbucket.sh
        # prepended its bindir to $GITHUB_PATH for later steps in this job. Same
        # K, count, node-prefixes and four exclude-module globs as the real plan,
        # so the cold-start plan is scoped identically. The coverage gate inside
        # `plan` is what makes this meaningful: it fails loudly if any live
        # package is left unscheduled.
        run: |
          set -euo pipefail
          testbucket plan \
            --k "$TESTBUCKET_K" \
            --count 100 \
            --store "$RUNNER_TEMP/definitely-not-a-store.json" \
            --node-prefixes adapters \
            --exclude-module 'adapters/adapter_*' \
            --exclude-module 'dynclient/baml-patched' \
            --exclude-module 'internal/nativebody/nanollmprepare' \
            --exclude-module 'nativeserve'

  # ---------------------------------------------------------------------------
  # 2/3 — TEST. One job per bucket, each running only its own slice.
  test:
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Each bucket is a K-th of the sweep plus fixed overhead. 30 leaves room
    # for a badly balanced early run on a cold store without hiding a hang.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    env:
      # Same CapStress knob the existing lanes carry, so the bucketed runs are
      # envelope-identical to the ones they are being compared against.
      BAML_HEAVY_TEST_RUNS: "5"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node
        # Only the bucket holding the codegen/adapter packages shells out to
        # node; the pure-Go buckets skip the setup, as bamlutils-race already
        # does. `plan` marks which bucket that is.
        if: matrix.needs_node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "24.18.0"

      - name: Install goimports
        if: matrix.needs_node
        run: go install golang.org/x/tools/cmd/goimports@latest

      - name: Run bucket ${{ matrix.bucket }}
        # testbucket v0.1.1 run-bucket: installs the binary (for `testbucket
        # render`), writes the plan-generated script, runs it, and pipes its
        # `go test -json` through the renderer to a human-readable log — taking
        # the SCRIPT's status (PIPESTATUS[0]), never the renderer's, so a happy
        # renderer can't make a red bucket look green. The generated script
        # already carries -json and tees each stream into events-dir for the
        # record job. The script itself is generated data passed through env,
        # never spliced into a command line.
        uses: invakid404/testbucket/.github/actions/run-bucket@551d49cea6a74a99706912fe18504f318bdba1cc # v0.1.1
        with:
          version: v0.1.1
          script: ${{ matrix.script }}
          name: ${{ matrix.name }}
          est-seconds: ${{ matrix.est_seconds }}
          events-dir: ${{ env.TESTBUCKET_EVENTS_DIR }}

      - name: Upload timing events
        # if: always() so a red bucket still contributes what it measured;
        # ingest drops a failed package's weight and keeps the rest.
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: testbucket-events-bucket-${{ matrix.bucket }}
          path: /tmp/testbucket-events/
          if-no-files-found: warn
          retention-days: 7

  # ---------------------------------------------------------------------------
  # ONCE-ONLY SERIAL GATES. Deliberately NOT bucketed (brief decision 5).
  #
  # These must run exactly once per commit: the two fresh-tree gates assert
  # that a generator is idempotent on a clean checkout, which is meaningless
  # run six times in parallel, and the tag-gated proofs rebuild and reboot
  # artifacts that would collide. They stay one serial job.
  #
  # They are copied verbatim from unit-tests.yml rather than shared, because
  # Phase C must not modify the workflow it is being compared against. That
  # means they run twice per commit during the side-by-side period — the
  # deliberate cost of keeping this workflow a complete replacement candidate.
  # Phase D deletes the originals along with the old lanes.
  once-only-gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25

    env:
      BAML_HEAVY_TEST_RUNS: "5"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "24.18.0"

      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@latest

      - name: Race-enabled compile coverage (no-test packages)
        # M1 — migrated from unit-tests.yml's `Run Unit Tests (all modules)`.
        # v0.1.1 schedules only packages that HAVE test files (HasTests=true) and
        # deliberately skips the rest, so the bucket sweep no longer compiles the
        # repo's test-free packages under -race. The old serial loop did, as a
        # side effect of `go test ./...`. This probe restores exactly that
        # race-enabled compile/link coverage without re-running any test:
        # `-run '^$'` matches no test, so every package in each module — including
        # the no-test ones (root cmd/*, internal/*, adapters/common/*,
        # bamlutils/{promptdescriptor,schemadescriptor}, dynclient's generated
        # packages, workerplugin/proto, …) — is compiled under -race but nothing
        # executes.
        #
        # It is the SAME module discovery/exclusion loop the old lane used, with
        # ONE change: the `./bamlutils/*` scheduling exclusion is dropped, so the
        # two bamlutils no-test packages are covered here too (the old lane split
        # bamlutils into its own `bamlutils-race` job, which carried no compile
        # probe of its own). The four REAL module exclusions are unchanged —
        # pinned adapters, vendored baml-patched, and the two cgo modules kept out
        # of go.work — matching the bucketed lane's own four exclude-module globs.
        # GOWORK=off for adapters/common only, exactly as the old loop did, since
        # common is deliberately outside go.work.
        #
        # Runs before the two fresh-tree gates below: like the old test loop it
        # may append additive sums to go.work.sum in workspace mode, and those
        # gates already restore go.work.sum before asserting a clean tree.
        run: |
          set -euo pipefail
          find . -name go.mod \
            -not -path '*/adapters/adapter_*' \
            -not -path '*/dynclient/baml-patched/*' \
            -not -path '*/internal/nativebody/nanollmprepare/*' \
            -not -path '*/nativeserve/*' \
            -exec dirname {} \; | while read -r dir; do
            echo "=== Compiling (race) $dir ==="
            if [ "$dir" = "./adapters/common" ]; then
              (cd "$dir" && GOWORK=off go test -race -count=1 -run '^$' ./...)
            else
              (cd "$dir" && go test -race -count=1 -run '^$' ./...)
            fi
          done

      - name: Subprocess build + test sanity
        # The default loop above runs everything under the no-tag build
        # (which is now the direct in-process worker path). The
        # `subprocess` tag flips a few key call sites and removes the
        # recover wrappers in pool + worker; this step
        # exercises that the tag still compiles cleanly and the
        # subprocess-only tests pass. Kept narrow on purpose — running
        # -race -count=100 across every module under subprocess would
        # roughly double CI wallclock for marginal additional coverage.
        run: |
          go build ./...
          # Route the subprocess-tag sanity build artifact to $RUNNER_TEMP so
          # it doesn't leave an untracked `serve` binary in the repo root
          # that would trip the `cmd/regenerate-dynclient fresh-tree gate`
          # below.
          go build -tags=subprocess -o "$RUNNER_TEMP/serve-build-sanity" ./cmd/serve
          go test -tags=subprocess -count=1 ./pool ./worker ./cmd/serve
          go test -race -tags=subprocess -count=1 ./pool ./worker

      - name: de-BAML S2 artifact profile proofs
        # Two tag-gated proofs for the serving-cutover S2 artifact contract that
        # the default loop above cannot run:
        #
        #  - `nativeworkerartifact` is the build tag cmd/build/build.sh sets when
        #    it embeds an isolated-module (natively linked) worker. The tagged
        #    half of the tag-split host constant only compiles under it, so
        #    without this step the "this build is the native-capable artifact"
        #    assertion would be dead code and the tag could silently invert.
        #
        #  - `artifactrehearsal` is the LIVE rollback rehearsal: it builds the
        #    BAML-only rollback worker, boots it through the real go-plugin
        #    handshake, serves RPCs on it, and requires that a MISLABELLED profile
        #    stamp — and a well-formed but WRONG release artifact ID — refuse to
        #    serve. It is tag-gated because the default loop runs every test with
        #    -race -count=100, and rebuilding and rebooting a worker binary a
        #    hundred times would dominate that lane.
        #
        # The NATIVE-capable artifacts are proved separately, in nanollm-prepare.yml
        # (`-tags=nativeartifactproof`), because only that lane can build them: they
        # need CGO and a linked nanollm archive, which this lane deliberately keeps
        # out. That proof fails rather than skips when the artifacts are missing.
        #
        # Both write their build output outside the repo (RUNNER_TEMP / the
        # test's own temp dir) so the fresh-tree gates below stay clean.
        run: |
          go vet -tags=nativeworkerartifact ./cmd/serve
          go build -tags=subprocess,nativeworkerartifact -o "$RUNNER_TEMP/serve-native-artifact-sanity" ./cmd/serve
          go test -tags=subprocess,nativeworkerartifact -count=1 ./cmd/serve
          go vet -tags=artifactrehearsal ./internal/workerboot
          go test -tags=artifactrehearsal -count=1 -timeout 10m ./internal/workerboot

      - name: Verify framework adapter codegen-emit
        # Two independent checks per adapter: deterministic emission
        # (run the emitter twice, byte-compare) and behavioural test
        # parity (copy the per-adapter module to a tempdir, write the
        # emitted adapter.go into it, run GOWORK=off go test ./adapter/).
        # The verifier writes only to tempdirs; the source-tree
        # adapters/adapter_v*/adapter/ siblings (test harnesses,
        # dynamic_value.go) are never touched.
        run: go run ./cmd/verify-framework-adapter

      - name: scripts/sync.sh fresh-tree gate
        # Fresh-tree gate for the sync.sh / per-adapter BAML-pin contract.
        # Running sync.sh on a clean checkout must leave every pinned
        # module's go.mod / go.sum byte-identical: if `go work sync` ever
        # lifts a pin (the regression fixed by removing adapters/common
        # from go.work), this step fails with a diff. The verify step
        # double-asserts the pin matrix via cmd/verify-adapter-pins so a
        # diff-free-but-wrong state can't slip through either.
        #
        # The diff covers ALL Go module metadata, not just adapter paths
        # (#473). scripts/sync.sh is a bounded fixed-point loop, so a
        # converged tree re-run must be byte-clean across every go.mod /
        # go.sum / go.work / go.work.sum. Diffing the whole set here means
        # a future non-convergence surfaces as a direct "scripts/sync.sh
        # is not idempotent" failure at this step, instead of leaking into
        # the confusing "tree dirty before cmd/regenerate-dynclient" error
        # downstream — which is exactly how #473 manifested.
        #
        # go.work.sum is excluded from --exit-code and restored instead:
        # it's an additive checksum database (not a lockfile), and an
        # earlier workspace-mode Go command in this job may have appended
        # module-content sums the committed file lacks. That additive
        # growth is tolerated repo-wide (see the cmd/regenerate-dynclient
        # gate below and #442); restoring it to HEAD keeps that tolerance
        # while the full set below still fails on any go.mod/go.sum drift.
        run: |
          git status --porcelain
          ./scripts/sync.sh
          git checkout -- go.work.sum 2>/dev/null || true
          git diff --exit-code -- \
            go.mod go.sum go.work \
            '*/go.mod' '*/go.sum'

      - name: cmd/regenerate-dynclient fresh-tree gate
        # Fresh-tree gate for committed dynclient regeneration artifacts.
        # The regen tool owns dynclient/internal/generated/**,
        # dynclient/baml-patched/**, root embed.go, and related provenance.
        # Running it on a clean checkout must leave the tree byte-identical.
        # Pairs with PR #299 normalization — without this gate, regen drift
        # accumulates silently across PRs (the latent-drift class of bug
        # that produced #299).
        run: |
          # go.work.sum may be dirtied by earlier workspace-mode Go commands
          # (the per-module test loop above appends additive module-content
          # checksums). Restore the committed version before checking
          # dynclient-owned drift. This only discards uncommitted go.work.sum
          # mutations — `git checkout -- go.work.sum` restores it to HEAD,
          # which already includes any committed PR change, and the full-tree
          # status check immediately below still fails on every other dirty
          # file (#442).
          git checkout -- go.work.sum 2>/dev/null || true

          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR: tree is dirty before cmd/regenerate-dynclient."
            git status --short
            git diff
            exit 1
          fi

          go run ./cmd/regenerate-dynclient

          # go.work.sum is an additive checksum database, not a lockfile.
          # The regen's transitive `go mod tidy` may append entries that
          # weren't present at commit time if the Go module proxy has
          # published new sums since. Restore the committed version so
          # additive-only sum drift doesn't trip the idempotency gate.
          git checkout -- go.work.sum 2>/dev/null || true

          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR: cmd/regenerate-dynclient is not idempotent on this commit."
            git status --short
            echo
            echo "Tracked diff:"
            git diff
            echo
            echo "Untracked files:"
            git ls-files --others --exclude-standard
            exit 1
          fi


  # ---------------------------------------------------------------------------
  # 3/3 — RECORD. Master-only, exactly as the Phase B path (#656 decision 3).
  record:
    needs: [plan, test]
    # !cancelled() rather than always(): record what a red run measured, but
    # not a cancelled one whose artifacts are arbitrary partial captures.
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download timing events
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: testbucket-events-bucket-*
          merge-multiple: true
          path: ${{ runner.temp }}/testbucket-events

      - name: Download the shard plan
        uses: actions/download-artifact@v8.0.1
        with:
          name: testbucket-shard-plan
          path: ${{ runner.temp }}/plan

      - name: Restore the previous timing store
        # Restored BEFORE the record action so its ingest folds the new
        # measurements into the existing store rather than cold-starting one.
        uses: actions/cache/restore@v4.2.4
        with:
          path: ${{ runner.temp }}/testbucket-store
          key: testbucket-timings-bucketed-v1-${{ github.sha }}
          restore-keys: |
            testbucket-timings-bucketed-v1-
            testbucket-timings-v1-

      - name: Audit the run, then ingest the measured timings
        # testbucket v0.1.1 record: AUDIT the finished run against the plan it
        # fanned out from — the plan's coverage gate proved the MATRIX was
        # complete before anything ran; this proves the RUN was (a bucket that
        # produced no events, an artifact that failed to upload, a shard that
        # died before reporting are all invisible to the plan-time gate) — then
        # INGEST the measured timings so the next split is better than this one.
        # It finishes by echoing the whale split decisions on the recorded
        # store. baml still owns the Actions cache: the store is restored above
        # and saved + uploaded below; the action only reads/writes store-path.
        #
        #   version: v0.1.1   pin the installed binary (no `v1` release exists).
        #   count: "100"      F1 — matches the plan; keeps the comparability
        #                     token `-race -count=100`, so these timings stay
        #                     comparable with the store instead of cold-starting.
        #   k                 --whale-k is derived from it, so the whale split
        #                     policy is recorded against total/K exactly as before.
        #   exclude-module    the SAME four globs the plan used, so the ingest's
        #                     stale-row pruning discovery sees the same module set.
        uses: invakid404/testbucket/.github/actions/record@551d49cea6a74a99706912fe18504f318bdba1cc # v0.1.1
        with:
          version: v0.1.1
          k: ${{ env.TESTBUCKET_K }}
          count: "100"
          store-path: ${{ runner.temp }}/testbucket-store/test-timings.json
          events-dir: ${{ runner.temp }}/testbucket-events
          shard-plan: ${{ runner.temp }}/plan/shard-plan.json
          exclude-module: |
            adapters/adapter_*
            dynclient/baml-patched
            internal/nativebody/nanollmprepare
            nativeserve

      - name: Validate the freshly recorded store can plan the next run
        # M2 — migrated from unit-tests.yml's `Show the plan the next PR will
        # get`. The record action above ingested the measured timings; this
        # proves the store it just wrote can IMMEDIATELY produce a complete,
        # coverage-gated plan for the next PR at the real envelope. Unlike the
        # action's trailing best-effort `whales ... || true`, this is a GATE: a
        # store that can no longer schedule every live target (a dropped whale, a
        # discovery mismatch, an incomplete split) fails this master run rather
        # than silently shipping a bad split to every downstream PR. Placed after
        # the ingest and BEFORE the cache save, so a store that cannot plan is
        # never persisted.
        #
        # The standalone binary is already on PATH: the record action installed
        # it via install-testbucket.sh, which prepends its bindir to $GITHUB_PATH
        # for later steps in this job. Same store path, K, count, node-prefixes
        # and four exclude-module globs the action used, so the plan is scoped
        # identically. No --json: the loaded-vs-missing summary and the split
        # land directly in this job's log. The coverage gate runs inside `plan`
        # regardless of --json, so a green line here is a real coverage statement.
        run: |
          set -euo pipefail
          echo "planning at the recorded K=$TESTBUCKET_K against the freshly ingested store"
          testbucket plan \
            --k "$TESTBUCKET_K" \
            --count 100 \
            --store "$RUNNER_TEMP/testbucket-store/test-timings.json" \
            --node-prefixes adapters \
            --exclude-module 'adapters/adapter_*' \
            --exclude-module 'dynclient/baml-patched' \
            --exclude-module 'internal/nativebody/nanollmprepare' \
            --exclude-module 'nativeserve'

      - name: Save the timing store
        # Writes on a new master commit; on a same-SHA re-run the entry
        # already exists and the action warns instead of overwriting, which
        # keeps the split deterministic for a given SHA.
        uses: actions/cache/save@v4.2.4
        with:
          path: ${{ runner.temp }}/testbucket-store
          key: testbucket-timings-bucketed-v1-${{ github.sha }}

      - name: Upload the timing store
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: testbucket-timing-store-bucketed
          path: ${{ runner.temp }}/testbucket-store/test-timings.json
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # M4 — per-module GOWORK=off published-module sanity matrix.
  #
  # Copied VERBATIM from unit-tests.yml's `standalone-modules` job: the bucket
  # sweep runs six of these modules in workspace mode (and adapters/common
  # standalone but under the race/count-100 sweep), which masks per-module
  # go.sum drift, and it does not schedule dynclient/baml-patched at all. Only a
  # GOWORK=off `go test ./...` from inside each published module proves its own
  # go.sum is complete for external consumers who never share our go.work.
  # Per-module GOWORK=off sanity matrix for the modules we publish
  # release tags for. The job above runs everything under the
  # workspace, which masks per-module go.sum drift: a missing
  # `pkg@ver/go.mod` hash in worker/go.sum is silently covered by
  # go.work.sum during the workspace build, so the failure only
  # surfaces during release-prep (or for external consumers who
  # always resolve via GOWORK=off semantics, since they don't share
  # our go.work). #327 was the most recent miss of this shape: a
  # stale dynclient/go.sum that only got caught by a maintainer's
  # manual check during the 0.0.47 release-prep.
  #
  # Matrix mirrors release-lib.sh's `release_required_modules`
  # (scripts/release-lib.sh:19-27). Keep the two in sync if a future
  # release adds or removes a published module. adapters/adapter_v*
  # and the root module are excluded for the same reasons
  # release-lib.sh excludes them (per-adapter BAML pins, workspace-only
  # respectively).
  standalone-modules:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        module:
          - adapters/common
          - bamlutils
          - dynclient
          - dynclient/baml-patched
          - introspected
          - worker
          - workerplugin

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: GOWORK=off go test ./...
        run: |
          cd "${{ matrix.module }}"
          GOWORK=off go test ./... -count=1

  # ---------------------------------------------------------------------------
  # THE SINGLE STABLE REQUIRED CONTEXT (scope §4). Every other unit-test job in
  # this workflow has a dynamic name (the six buckets carry timing-weighted
  # matrix names) or is master-only (`record` skips PRs), so none is a stable
  # thing branch protection can require. This aggregate is: it FAILS CLOSED
  # unless every needed job concluded `success`, so a skipped, cancelled, or
  # failed dependency turns it red. Once PR B deletes unit-tests.yml, this is the
  # one context to mark required on master.
  #
  # `record` is deliberately absent from `needs`: it is master-push-only (its
  # `if` skips PRs), so requiring it would strand every PR. It stays a master
  # health gate, not a PR-required context.
  unit-tests-bucketed-gate:
    needs: [plan, test, once-only-gates, standalone-modules]
    # always() so this job runs even when a dependency failed or was skipped —
    # otherwise a failed upstream would SKIP this gate, and a skipped required
    # context reads as "not failing" to branch protection, i.e. fails open.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5

    steps:
      - name: Assert every unit-test job succeeded
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          TEST_RESULT: ${{ needs.test.result }}
          ONCE_ONLY_RESULT: ${{ needs.once-only-gates.result }}
          STANDALONE_RESULT: ${{ needs.standalone-modules.result }}
        run: |
          set -euo pipefail
          echo "plan=$PLAN_RESULT test=$TEST_RESULT once-only-gates=$ONCE_ONLY_RESULT standalone-modules=$STANDALONE_RESULT"
          # `test` and `standalone-modules` are matrix jobs; their aggregate
          # result is `success` only when EVERY cell succeeded, so this covers
          # all six buckets and all seven standalone cells. Anything other than
          # `success` (failure / cancelled / skipped) fails the gate closed.
          fail=0
          for pair in \
            "plan:$PLAN_RESULT" \
            "test:$TEST_RESULT" \
            "once-only-gates:$ONCE_ONLY_RESULT" \
            "standalone-modules:$STANDALONE_RESULT"; do
            name=${pair%%:*}
            result=${pair#*:}
            if [ "$result" != "success" ]; then
              echo "::error::unit-test dependency '$name' concluded '$result' (expected success)"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "unit-tests-bucketed-gate: FAILING closed — not every unit-test job succeeded."
            exit 1
          fi
          echo "unit-tests-bucketed-gate: all unit-test jobs succeeded."
